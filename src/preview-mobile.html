<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Mobile preview — Final Affairs</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #E8E4DF;
    font-family: "Nunito Sans", system-ui, sans-serif;
    color: #23395D;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 28px 16px 48px;
    box-sizing: border-box;
  }
  h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tabs button {
    padding: 9px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid #d9d2c7; background: #FCFAF8; color: #23395D;
    font: 700 11px/1 "Nunito Sans", system-ui, sans-serif;
    letter-spacing: 1.2px; text-transform: uppercase;
  }
  .tabs button[aria-pressed="true"] { background: #23395D; color: #FCFAF8; border-color: #23395D; }
  .phone {
    width: 390px; max-width: 100%;
    height: min(844px, 82vh);
    border-radius: 34px; padding: 10px; background: #262625;
    box-shadow: 0 30px 70px rgba(0,0,0,0.32);
    box-sizing: content-box;
  }
  .phone iframe {
    width: 100%; height: 100%; border: 0;
    border-radius: 26px; background: #FCFAF8; display: block;
  }
  p.note { margin: 0; max-width: 420px; text-align: center; font-size: 13px; font-weight: 300; color: #5f6b7a; }
</style>
</head>
<body>
<h1>Mobile preview</h1>
<div class="tabs" id="tabs"></div>
<div class="phone"><iframe id="frame" src="final-record.html" title="Mobile preview"></iframe></div>
<p class="note">The site is one responsive build — this frame is 390px wide, so it shows the mobile layout. Widen your own window past 768px to see the desktop design.</p>
<script>
  var PAGES = [
    ['Final record', 'final-record.html'],
    ['Your Memories', 'your-memories.html'],
    ['Home', 'index.html'],
    ['About Us', 'about-us.html'],
    ['For Families', 'for-families.html'],
    ['For Funeral Homes', 'for-funeral-homes.html'],
    ['For Attorneys', 'for-attorneys.html'],
    ['Contact Us', 'contact-us.html']
  ];
  var tabs = document.getElementById('tabs');
  var frame = document.getElementById('frame');
  PAGES.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[0];
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', function () {
      frame.src = p[1];
      tabs.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
    });
    tabs.appendChild(b);
  });
</script>
</body>
</html>
